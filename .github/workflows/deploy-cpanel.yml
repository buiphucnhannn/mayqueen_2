# Tự động deploy lên hosting cPanel (Setup Node.js App) mỗi khi push lên nhánh main.
#   - Sửa be/**  → build + deploy backend: api.mayqueenslim.com (+ api.mayqueen.vn nếu đã cấu hình)
#   - Sửa fe/**  → build + deploy website: mayqueenslim.com (+ mayqueen.vn) — chạy SAU backend
#   2 tên miền = 2 BỘ MÁY RIÊNG (thư mục app riêng, khởi động riêng): site này lỗi / deploy hỏng (tự quay về bản
#   cũ) thì site kia vẫn chạy và vẫn deploy bình thường.
#   - Chạy tay: Actions → "Deploy hosting cPanel" → Run workflow (deploy cả hai)
#
# Cách deploy (an toàn, gần như không gián đoạn):
#   build trên GitHub (Linux) → nén 1 file → gửi lên hosting qua SSH → giải nén ra thư mục mới → giữ lại .env →
#   tráo thư mục mới vào chỗ cũ (bản cũ cất ở ~/.deploy/*-prev) → khởi động lại app → kiểm tra sống.
#   Kiểm tra lỗi → TỰ ĐỘNG quay về bản cũ.
#
# Khai báo 1 lần ở GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   CPANEL_SSH_KEY (private key), PROXY_SECRET (cùng giá trị với .env của backend)
#   Variables: CPANEL_SSH_HOST (VD 103.200.23.68), CPANEL_SSH_PORT (VD 22), CPANEL_SSH_USER (user cPanel),
#              NEXT_PUBLIC_SITE_URL (https://mayqueenslim.com), BACKEND_URL (https://api.mayqueenslim.com)
#   Site thứ 2 (tuỳ chọn): VN_SITE_URL (https://mayqueen.vn), VN_BACKEND_URL (https://api.mayqueen.vn)
#              — có VN_SITE_URL thì mayqueen.vn là tên miền CHÍNH cho SEO (xem bước Build website)
#              — chưa khai báo thì chỉ deploy site .com
# Chưa khai báo CPANEL_SSH_HOST → chỉ build + lưu gói zip ở mục Artifacts, KHÔNG deploy (push vẫn an toàn).
name: Deploy hosting cPanel

on:
  push:
    branches: [main]
    paths:
      [
        "be/**",
        "fe/**",
        ".github/workflows/deploy-cpanel.yml",
        ".github/scripts/**",
      ]
  workflow_dispatch:

# không cho 2 lần deploy chạy chồng lên nhau; lần mới chờ lần cũ xong
concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

env:
  SSH_HOST: ${{ vars.CPANEL_SSH_HOST }}
  SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '22' }}
  SSH_USER: ${{ vars.CPANEL_SSH_USER }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.api == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api: ["be/**", ".github/workflows/deploy-cpanel.yml", ".github/scripts/**"]
            web: ["fe/**", ".github/workflows/deploy-cpanel.yml", ".github/scripts/**"]

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: be/package-lock.json
      - name: Kiểm tra code backend
        working-directory: be
        run: |
          npm ci
          npm run lint
      - name: Đóng gói backend (kèm thư viện production)
        run: |
          mkdir -p out/app
          cp -r be/app.cjs be/src be/scripts be/package.json be/package-lock.json out/app/
          (cd out/app && npm ci --omit=dev --ignore-scripts)
          tar -czf api.tar.gz -C out/app .
      - uses: actions/upload-artifact@v4
        with:
          name: mayqueen-api
          path: api.tar.gz
          retention-days: 7
      - name: Deploy backend mayqueenslim.com
        id: com
        if: env.SSH_HOST != ''
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          HEALTH_URL: ${{ vars.BACKEND_URL }}/api/v1/health
        run: bash .github/scripts/cpanel-deploy.sh api mayqueen-api api.tar.gz
      - name: Deploy backend mayqueen.vn
        id: vn
        if: env.SSH_HOST != '' && vars.VN_BACKEND_URL != ''
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          HEALTH_URL: ${{ vars.VN_BACKEND_URL }}/api/v1/health
        run: bash .github/scripts/cpanel-deploy.sh api-vn mayqueen-api-vn api.tar.gz
      - name: Kết quả
        if: steps.com.outcome == 'failure' || steps.vn.outcome == 'failure'
        run: |
          echo "::error::Deploy backend lỗi: .com=${{ steps.com.outcome }} .vn=${{ steps.vn.outcome }} (site lỗi đã tự quay về bản cũ, site kia không bị ảnh hưởng)"
          exit 1

  web:
    needs: [changes, api]
    # chạy cả khi backend không đổi (job api bị bỏ qua) và cả khi 1 site deploy backend lỗi (site đó đã tự quay
    # về bản cũ, vẫn chạy) → site còn lại vẫn được cập nhật website
    # chưa khai báo BACKEND_URL (chưa dùng hosting) → push bỏ qua build website thay vì báo lỗi đỏ
    if: >-
      always() && needs.changes.outputs.web == 'true' && needs.api.result != 'cancelled' &&
      (vars.BACKEND_URL != '' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - name: Build website (Next.js standalone)
        working-directory: fe
        env:
          NEXT_OUTPUT: standalone
          NEXT_TELEMETRY_DISABLED: 1
          # Tên miền CHÍNH cho SEO (canonical, sitemap, robots, Open Graph, JSON-LD) = mayqueen.vn: cả 2 site dùng
          # chung bản build, site .com vẫn chạy (dự phòng) nhưng báo Google "bản gốc là .vn" → không trùng lặp
          # nội dung, sitemap nạp ở Search Console mayqueen.vn hợp lệ. Muốn đổi tên miền chính → đặt Variable
          # CANONICAL_SITE_URL. (Site tự gọi lại chính nó dùng SITE_ORIGIN trong .env từng site, không phụ thuộc biến này.)
          NEXT_PUBLIC_SITE_URL: ${{ vars.CANONICAL_SITE_URL || vars.VN_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
        run: |
          test -n "$NEXT_PUBLIC_SITE_URL" -a -n "$BACKEND_URL" -a -n "$PROXY_SECRET" \
            || { echo "::error::Thiếu NEXT_PUBLIC_SITE_URL / BACKEND_URL (Variables) hoặc PROXY_SECRET (Secrets)"; exit 1; }
          # tên miền chính đi vào canonical / sitemap của MỌI trang → nhập sai (vd. ghi nhầm tên biến) là hỏng SEO
          # cả 2 site → dừng deploy, site đang chạy giữ nguyên
          echo "Tên miền chính (SEO): $NEXT_PUBLIC_SITE_URL"
          echo "$NEXT_PUBLIC_SITE_URL" | grep -Eq '^https://([a-z0-9-]+\.)+[a-z]{2,}/?$' \
            || { echo "::error::Tên miền chính không hợp lệ: '$NEXT_PUBLIC_SITE_URL' — sửa Variable VN_SITE_URL (hoặc CANONICAL_SITE_URL) thành dạng https://mayqueen.vn"; exit 1; }
          npm ci
          npm run lint
          npm run build
      - name: Đóng gói website
        run: |
          mkdir -p out/app/.next out/app/public
          cp -r fe/.next/standalone/. out/app/
          cp -r fe/.next/static out/app/.next/static
          cp -r fe/public/. out/app/public/
          test -f out/app/server.js
          tar -czf web.tar.gz -C out/app .
      - uses: actions/upload-artifact@v4
        with:
          name: mayqueen-web
          path: web.tar.gz
          retention-days: 7
      - name: Deploy website mayqueenslim.com
        id: com
        if: env.SSH_HOST != ''
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          HEALTH_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: bash .github/scripts/cpanel-deploy.sh web mayqueen-web web.tar.gz
      # cùng 1 bản build; khác nhau ở .env của từng thư mục (BACKEND_URL, SITE_ORIGIN, PEER_SITES)
      - name: Deploy website mayqueen.vn
        id: vn
        if: env.SSH_HOST != '' && vars.VN_SITE_URL != ''
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          HEALTH_URL: ${{ vars.VN_SITE_URL }}
        run: bash .github/scripts/cpanel-deploy.sh web-vn mayqueen-web-vn web.tar.gz
      - name: Kết quả
        if: steps.com.outcome == 'failure' || steps.vn.outcome == 'failure'
        run: |
          echo "::error::Deploy website lỗi: .com=${{ steps.com.outcome }} .vn=${{ steps.vn.outcome }} (site lỗi đã tự quay về bản cũ, site kia không bị ảnh hưởng)"
          exit 1
